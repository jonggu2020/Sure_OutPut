# ============================================================
# Model 1 (피싱 탐지) 재학습 파이프라인
# ============================================================
# 트리거:
#   - 매일 새벽 (KST 04:00) cron 자동 실행
#   - 관리자 수동 실행 (Actions 탭의 "Run workflow" 버튼)
#
# 흐름:
#   1) training_data.csv 행 수 확인 → 500 초과일 때만 진행
#   2) train.py   : 원본+신규 병합 재학습 → 후보 모델 + WandB 기록
#   3) evaluate.py: 후보 vs 현재 모델 비교 → 통과 시 승격, 하락 시 차단
#
# 실행 위치: 본인 PC에 등록된 self-hosted runner
#   - phiusiil_full.csv, phishing_ml_model.pkl 이 그 PC에만 있으므로
#   - runner 는 GitHub 로 outbound 만 하므로 NAT Loopback 제약과 무관
#
# 모델 승격 후 재시작:
#   evaluate.py 가 phishing_ml_model.pkl 을 교체하지만, 실행 중인
#   Model 1 서버는 옛 모델을 메모리에 들고 있다. 다음에 서버를 끄고
#   켤 때 lifespan 의 load_model() 이 새 모델을 읽는다 → 자동 반영.
# ============================================================

name: Retrain Model 1 (Phishing)

on:
  schedule:
    # cron 은 UTC 기준. KST 04:00 = UTC 19:00 (전날)
    - cron: '0 19 * * *'
  workflow_dispatch:        # 관리자 수동 실행 허용

# 동시에 두 번 재학습이 도는 것을 방지
concurrency:
  group: retrain-model1
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: [self-hosted, model1]   # 본인 PC에 등록된 runner 라벨
    defaults:
      run:
        working-directory: model-phishing

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      # ── 1) 재학습 임계값 확인 ──────────────────────────────
      # training_data.csv 의 데이터 행 수(헤더 제외)가 500 초과일 때만 진행.
      # 수동 실행(workflow_dispatch)이어도 동일하게 임계값을 적용한다.
      - name: 재학습 임계값 확인 (training_data.csv > 500행)
        id: gate
        shell: pwsh
        run: |
          $csv = "data/training_data.csv"
          if (-not (Test-Path $csv)) {
            Write-Host "training_data.csv 없음 — 수집된 데이터가 없습니다."
            echo "proceed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          # 전체 줄 수 - 1(헤더) = 데이터 행 수
          $rows = (Get-Content $csv | Measure-Object -Line).Lines - 1
          Write-Host "수집된 재학습 데이터: $rows 행"
          if ($rows -gt 500) {
            Write-Host "임계값(500) 초과 → 재학습을 진행합니다."
            echo "proceed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "임계값(500) 미달 → 이번 주기는 건너뜁니다."
            echo "proceed=false" >> $env:GITHUB_OUTPUT
          }

      # ── 2) 재학습 ──────────────────────────────────────────
      - name: 재학습 실행 (train.py)
        if: steps.gate.outputs.proceed == 'true'
        shell: pwsh
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          python -m app.mlops.train

      # ── 3) 평가 게이트 ─────────────────────────────────────
      # evaluate.py 는 후보가 현재 모델보다 나쁘면 종료코드 1 로 끝난다.
      # 그 경우 이 스텝이 실패하고 — 후보는 evaluate.py 내부에서 폐기된다.
      - name: 평가 게이트 + 모델 승격 (evaluate.py)
        if: steps.gate.outputs.proceed == 'true'
        shell: pwsh
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          python -m app.mlops.evaluate

      # ── 4) 결과 안내 ───────────────────────────────────────
      - name: 완료 안내
        if: steps.gate.outputs.proceed == 'true'
        shell: pwsh
        run: |
          Write-Host "============================================"
          Write-Host " 재학습 파이프라인 완료."
          Write-Host " 모델이 교체되었다면, Model 1 서버를 끄고"
          Write-Host " 다시 켤 때 새 모델이 자동 반영됩니다."
          Write-Host "============================================"

      - name: 건너뜀 안내
        if: steps.gate.outputs.proceed != 'true'
        shell: pwsh
        run: |
          Write-Host "재학습 데이터가 임계값(500행)에 도달하지 않아 건너뛰었습니다."